<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokeMemo</title>
  <style>
    :root {
      --ink: #172033;
      --panel: rgba(255, 255, 255, 0.9);
      --panel-strong: #ffffff;
      --blue: #2456a6;
      --yellow: #ffcb05;
      --red: #e83f3f;
      --green: #3aa66f;
      --shadow: 0 24px 70px rgba(20, 31, 55, 0.28);
      --card-size: clamp(68px, 18vw, 126px);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0.86), rgba(222, 235, 255, 0.72)),
        url("./imagenes/bodybg1.jpg") center / cover fixed;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1120px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0;
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(320px, 1fr);
      gap: 24px;
      align-items: center;
    }

    .sidebar {
      padding: 26px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .title {
      margin: 0;
      color: var(--blue);
      font-size: clamp(2.35rem, 3.6vw, 2.85rem);
      line-height: 0.9;
      font-weight: 950;
      letter-spacing: 0;
      text-transform: uppercase;
      text-shadow: 0 4px 0 var(--yellow), 0 9px 22px rgba(36, 86, 166, 0.24);
    }

    .subtitle {
      margin: 20px 0 0;
      color: #42516e;
      font-size: 1rem;
      line-height: 1.55;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 24px 0;
    }

    .stat {
      padding: 12px 10px;
      border: 1px solid #d8e3f6;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
    }

    .stat > span {
      display: block;
      color: #5a6a85;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .stat strong {
      display: block;
      margin-top: 5px;
      color: var(--ink);
      font-size: 1.45rem;
      line-height: 1;
    }

    .stat strong span {
      display: inline;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .button {
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
      font-weight: 800;
      box-shadow: 0 12px 24px rgba(36, 86, 166, 0.28);
      transition: transform 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
    }

    .button:hover {
      background: #1d4a92;
      box-shadow: 0 16px 28px rgba(36, 86, 166, 0.34);
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(0);
    }

    .board-shell {
      position: relative;
      padding: clamp(14px, 3vw, 24px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    #tablero {
      display: grid;
      grid-template-columns: repeat(4, var(--card-size));
      gap: clamp(8px, 1.8vw, 14px);
      justify-content: center;
    }

    .cuadro {
      width: var(--card-size);
      aspect-ratio: 1;
      border: 4px solid #1c2f50;
      border-radius: 8px;
      background-color: var(--panel-strong);
      background-image: url("./imagenes/pball.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: 74%;
      box-shadow: inset 0 -10px 0 rgba(23, 32, 51, 0.08), 0 10px 22px rgba(20, 31, 55, 0.18);
      cursor: pointer;
      transition: transform 170ms ease, box-shadow 170ms ease, border-color 170ms ease, background-color 170ms ease;
    }

    .cuadro:hover {
      border-color: var(--red);
      box-shadow: inset 0 -10px 0 rgba(23, 32, 51, 0.08), 0 16px 28px rgba(20, 31, 55, 0.22);
      transform: translateY(-3px);
    }

    .cuadro.revelado {
      background-color: #edf5ff;
      background-size: 112%;
      border-color: var(--blue);
      cursor: default;
      transform: translateY(-2px);
    }

    .cuadro.revelado.bidoof,
    .cuadro.revelado.caterpie {
      background-size: 245%;
      background-position: 50% 84%;
    }

    .cuadro.revelado.darumaka,
    .cuadro.revelado.ditto {
      background-size: 170%;
      background-position: 50% 74%;
    }

    .cuadro.revelado.sneasel {
      background-size: 165%;
      background-position: 50% 68%;
    }

    .cuadro.revelado.silveon {
      background-size: 135%;
      background-position: 50% 64%;
    }

    .cuadro.revelado.ninetales {
      background-size: 122%;
      background-position: 50% 60%;
    }

    .cuadro.revelado.magikarp {
      background-size: 108%;
      background-position: 50% 50%;
    }

    .cuadro.completo {
      background-color: #eafff3;
      background-size: 64%;
      border-color: var(--green);
      pointer-events: none;
      transform: scale(0.98);
    }

    .cuadro.bloqueado {
      pointer-events: none;
    }

    #fin-juego {
      display: none;
      position: absolute;
      inset: 24px;
      place-items: center;
      padding: 24px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      text-align: center;
    }

    #fin-juego.visible {
      display: grid;
    }

    .end-title {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 0.95;
      font-weight: 950;
      text-transform: uppercase;
      text-shadow: 0 4px 0 var(--yellow);
    }

    .end-copy {
      margin: 0 0 22px;
      color: #42516e;
      font-size: 1.05rem;
    }

    @media (max-width: 780px) {
      .app {
        grid-template-columns: 1fr;
        align-items: start;
        padding: 18px 0;
      }

      .sidebar {
        padding: 20px;
      }

      .title {
        font-size: clamp(2.15rem, 11.5vw, 3rem);
      }

      .subtitle {
        margin-top: 14px;
      }

      .stats {
        margin: 18px 0;
      }
    }

    @media (max-width: 430px) {
      :root {
        --card-size: calc((100vw - 84px) / 4);
      }

      .app {
        width: min(100% - 20px, 1120px);
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="sidebar" aria-labelledby="game-title">
      <p class="eyebrow">Memotest</p>
      <h1 class="title" id="game-title">PokeMemo</h1>
      <p class="subtitle">Find all 8 Pokemon pairs with the fewest turns possible.</p>

      <div class="stats" aria-label="Game stats">
        <div class="stat">
          <span>Turns</span>
          <strong id="turnos">0</strong>
        </div>
        <div class="stat">
          <span>Pairs</span>
          <strong><span id="pares">0</span>/8</strong>
        </div>
        <div class="stat">
          <span>Best</span>
          <strong id="mejor">-</strong>
        </div>
      </div>

      <div class="actions">
        <button class="button" id="reiniciar" type="button">New game</button>
      </div>
    </section>

    <section class="board-shell" aria-label="Pokemon memory board">
      <div id="tablero" aria-live="polite"></div>

      <div id="fin-juego" role="status" aria-live="polite">
        <div>
          <h2 class="end-title">Great match</h2>
          <p class="end-copy">You finished in <strong id="turnos-final">0</strong> turns.</p>
          <button class="button" id="jugar-otra-vez" type="button">Play again</button>
        </div>
      </div>
    </section>
  </main>

  <script src="src/index.js"></script>
</body>
</html>
